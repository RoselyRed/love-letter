<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Music -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2023/03/27/audio_5f9b4d6c6b.mp3" type="audio/mp3">
</audio>

<!-- Theme Toggle -->
<div class="toggle" id="themeToggle">🌙</div>

<!-- Canvas -->
<canvas id="canvas"></canvas>

<!-- Intro Typing -->
<section class="intro">
  <div class="typing" id="typing"></div>
  <div class="continue hidden" id="continue">Tap to continue...</div>
</section>

<!-- Story -->
<section class="story hidden" id="story">

  <div class="panel">
    <p>It didn’t start like a movie…</p>
  </div>

  <div class="panel">
    <p>No dramatic music. No perfect timing.</p>
  </div>

  <div class="panel">
    <p>But somehow… you became my favorite part of every day.</p>
  </div>

  <div class="panel">
    <p>Even now… in silence…</p>
  </div>

  <div class="panel">
    <p>I still choose you.</p>
  </div>

  <div class="panel final">
    <h1 id="loveText">I Love You</h1>
  </div>

</section>

<script src="script.js"></script>
</body>
</html>
